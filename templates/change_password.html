{% extends 'base.html' %}

{% block title %}CHEM-MAN | ZMIEŃ HASŁO{% endblock %}

{% block extra_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/change_password.css') }}">
{% endblock %}

{% block header %}CHEM-MAN | ZMIEŃ HASŁO{% endblock %}

{% block content %}
<div class="form-container">
    <div class="section-header">
        <h2 class="section-title">Zmień Swoje Hasło</h2>
    </div>

    <form method="POST" action="{{ url_for('auth.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="current_password">Obecne hasło*</label>
            <input type="password" id="current_password" name="current_password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="new_password">Nowe hasło*</label>
            <input type="password" id="new_password" name="new_password" class="form-control" required minlength="8">
            <div class="password-requirements">
                Hasło musi składać się z co najmniej 8 znaków
            </div>
        </div>
        <div class="form-group">
            <label for="confirm_password">Potwierdź nowe hasło*</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="8">
        </div>

        <button type="submit" class="btn-change-password">Zmień Hasło</button>
    </form>
</div>
{% endblock %}

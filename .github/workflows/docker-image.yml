# Buduje obraz ChemMana i publikuje go w GitHub Container Registry (ghcr.io).
#
# Dzieki temu wdrozenie na serwerze sprowadza sie do `docker compose pull`
# — bez kompilowania czegokolwiek na maszynie produkcyjnej.
#
# Obrazy powstaja dla:
#   - kazdego tagu vX.Y.Z  -> :vX.Y.Z, :X.Y, :latest
#   - gałęzi master        -> :master  (do testow, nie do produkcji)
#
# KOLEJNOSC MA ZNACZENIE: obraz jest budowany i testowany LOKALNIE, a do
# rejestru trafia dopiero po przejsciu testow. Wczesniej publikacja szla przed
# smoke testem, wiec zepsuty obraz zostawal w ghcr.io (razem z tagiem
# `latest`) nawet gdy workflow konczyl sie na czerwono — i dalo sie go wdrozyc.
#
# Pierwszy opublikowany pakiet jest domyslnie PRYWATNY. Aby serwer mogl go
# pobrac bez logowania, zmien widocznosc pakietu na public w ustawieniach
# repozytorium (Packages -> chemman -> Package settings), albo zaloguj serwer:
#   echo $TOKEN | docker login ghcr.io -u <uzytkownik> --password-stdin

name: Build and publish Docker image

on:
  push:
    tags: ["v*.*.*"]
    branches: ["master"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------
  # 1. Testy jednostkowe. Bramka przed budowaniem obrazu.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Ta sama wersja co w obrazie (python:3.13-slim).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

  # ---------------------------------------------------------------------
  # 2. Budowa obrazu, smoke testy, dopiero potem publikacja.
  # ---------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        # github.repository zachowuje wielkosc liter ("blackemperor84/ChemMan"),
        # a odwolania do obrazow Dockera MUSZA byc pisane malymi literami —
        # inaczej build konczy sie bledem
        # "invalid reference format: repository name must be lowercase".
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build image (bez publikacji)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # load: obraz laduje do lokalnego demona, zeby dalo sie go uruchomic.
          load: true
          tags: chemman:ci
          # Cache warstw miedzy przebiegami — bez tego kazdy build kompiluje
          # od zera zaleznosci natywne (numpy, pandas, lxml, pillow).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------
      # Smoke test 1: czy obraz w ogole startuje.
      # Migracje wylaczone — to test samego obrazu, nie schematu bazy.
      # -----------------------------------------------------------------
      - name: Smoke test - obraz startuje
        run: |
          docker run -d --name chemman_smoke \
            -e SECRET_KEY=smoke-test-key-not-for-production \
            -e FLASK_ENV=production \
            -e RUN_MIGRATIONS=0 \
            -e RATELIMIT_STORAGE_URL=memory:// \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -p 8000:8000 \
            chemman:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/login > /dev/null; then
              echo "Aplikacja odpowiada."
              docker rm -f chemman_smoke
              exit 0
            fi
            sleep 2
          done

          echo "Aplikacja nie wystartowala. Logi kontenera:"
          docker logs chemman_smoke
          docker rm -f chemman_smoke
          exit 1

      # -----------------------------------------------------------------
      # Smoke test 2: swieza instalacja — schemat budowany WYLACZNIE
      # z migracji. To najwazniejsza sciezka przy nowym wdrozeniu i az do
      # teraz nie byla w CI sprawdzana w ogole.
      # -----------------------------------------------------------------
      - name: Smoke test - swieza instalacja przez migracje
        run: |
          docker run -d --name chemman_migrate \
            -e SECRET_KEY=smoke-test-key-not-for-production \
            -e FLASK_ENV=production \
            -e RUN_MIGRATIONS=1 \
            -e RATELIMIT_STORAGE_URL=memory:// \
            -e DATABASE_URL=sqlite:////tmp/smoke_migrate.db \
            -p 8001:8000 \
            chemman:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/login > /dev/null; then
              echo "Aplikacja odpowiada po migracjach."
              # Schemat musi stac na najnowszej rewizji, a nie byc pusty.
              docker exec \
                -e DATABASE_URL=sqlite:////tmp/smoke_migrate.db \
                chemman_migrate flask db current 2>&1 | tee /tmp/revision.txt
              grep -q "(head)" /tmp/revision.txt || {
                echo "BLAD: baza nie stoi na najnowszej rewizji."
                docker rm -f chemman_migrate
                exit 1
              }
              docker rm -f chemman_migrate
              exit 0
            fi
            sleep 2
          done

          echo "Aplikacja nie wystartowala po migracjach. Logi kontenera:"
          docker logs chemman_migrate
          docker rm -f chemman_migrate
          exit 1

      # -----------------------------------------------------------------
      # Logowanie dopiero przed publikacja: budowanie i smoke testy dzieja
      # sie lokalnie i nie potrzebuja dostepu do rejestru.
      # -----------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Token wystawiany automatycznie przez GitHub Actions — nie trzeba
          # zakladac wlasnego sekretu.
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      # Publikacja dopiero tutaj. Warstwy sa juz w cache, wiec to przebiega
      # szybko — nie jest to drugi pelny build.
      # -----------------------------------------------------------------
      - name: Publish to GHCR (po przejsciu smoke testow)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

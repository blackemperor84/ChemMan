[pytest]
# Zbieraj testy wylacznie z katalogu tests/.
#
# Katalog checks/ zawiera skrypty diagnostyczne uruchamiane recznie, a nie
# testy. Jeden z nich nazywa sie test_svhc.py, wiec goly `pytest` probowal go
# zaimportowac i przerywal zbieranie bledem, mimo ze `pytest tests/` przechodzil.
testpaths = tests

# Nie wchodz do katalogow, ktore nie zawieraja testow.
norecursedirs = checks DEMO venv .venv migrations instance logs .git __pycache__
